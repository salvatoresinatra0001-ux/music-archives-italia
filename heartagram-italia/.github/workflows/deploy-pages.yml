name: Pubblica Heartagram Italia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepara sito statico
        shell: bash
        run: |
          test -f index.html
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Carica artefatto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
