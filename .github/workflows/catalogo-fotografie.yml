name: Catalogo fotografie HD Commons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalogo-fotografie.yml'
      - 'scripts/catalogo_fotografie_commons.py'
permissions:
  contents: write
concurrency:
  group: commons-photo-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate metadata and galleries
        run: python scripts/catalogo_fotografie_commons.py
      - name: Commit catalogues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/fotografie/catalogo.csv' '*/fotografie/catalogo.json' '*/fotografie/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "Update Wikimedia Commons HD photo galleries"
            git push
          fi
