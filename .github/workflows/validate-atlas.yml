name: Validate Editorial Atlas v20
on:
  pull_request:
    paths:
      - 'atlante/**'
      - 'data/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/**'
      - '**/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate local archive and atlas links
        run: python3 scripts/validate_atlas.py
      - name: Compile structured archive generator
        run: python3 -m py_compile scripts/build_archive.py scripts/validate_atlas.py
