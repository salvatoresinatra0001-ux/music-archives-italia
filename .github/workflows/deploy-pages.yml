name: Distribuisci Music Archives Italia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'music-archives-italia-v13.1-GITHUB-PAGES-REPOSITORY-PRONTO.zip'
      - 'heartagram-italia/**'
      - 'assets/**'
      - 'archivi/**'
      - 'data/**'
      - 'scripts/**'
      - 'index.html'
      - 'atlante/**'
      - 'felix-marc-italia/**'
      - 'chrom-italia/**'
      - 'the-last-dance-italia/**'
      - 'rammstein-italia/**'
      - 'mylene-farmer-italia/**'
      - 'assemblage23-italia/**'
      - 'mesh-italia/**'
      - 'sandra-music-italia/**'
      - 'thebirthdaymassacre-italia/**'
      - 'ville-valo-him-heartagram-italia/**'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Unpack historical archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path('music-archives-italia-v13.1-GITHUB-PAGES-REPOSITORY-PRONTO.zip')
          site=Path('_site'); site.mkdir(exist_ok=True)
          with ZipFile(archive) as z:
              if z.testzip(): raise ValueError('Corrupted ZIP')
              for item in z.infolist():
                  path=Path(item.filename)
                  if item.is_dir() or path.is_absolute() or '..' in path.parts or 'storico' in path.parts or path.suffix.lower()=='.zip': continue
                  dest=site/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          PY
      - name: Overlay the editable editorial sites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          site=Path('_site')
          folders=['archivi','assets','data','atlante','heartagram-italia','mylene-farmer-italia','assemblage23-italia','mesh-italia','sandra-music-italia','thebirthdaymassacre-italia','ville-valo-him-heartagram-italia','felix-marc-italia','chrom-italia','the-last-dance-italia','rammstein-italia','rammstein-archivio-sonoro']
          shutil.copy2('index.html',site/'index.html')
          for folder in folders:
              if Path(folder).exists(): shutil.copytree(folder,site/folder,dirs_exist_ok=True,ignore=shutil.ignore_patterns('.github','README.md','*.zip'))
          required=['index.html','assets/editorial.css','archivi/index.html','atlante/index.html','data/catalog.json','data/ecosistema-v20.json']
          required.extend(str(p) for p in Path('archivi').glob('*/index.html'))
          for folder in folders:
              if folder not in ('assets','archivi','data'): required.append(folder+'/index.html')
              if folder == 'rammstein-archivio-sonoro': required.extend([folder+'/discografia.html',folder+'/fonti.html',folder+'/favicon.svg'])
              if folder in ('mylene-farmer-italia','assemblage23-italia','mesh-italia','sandra-music-italia','thebirthdaymassacre-italia','ville-valo-him-heartagram-italia'): required.extend([folder+'/profilo.html',folder+'/discografia.html',folder+'/ricerca.html'])
          missing=[p for p in required if not (site/p).is_file()]
          if missing: raise ValueError(f'Missing files: {missing}')
          (site/'.nojekyll').touch()
          print(f'Validated {len(required)} site files')
          PY
      - name: Validate structured archive and generate catalog pages
        run: python3 scripts/build_archive.py --output _site
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
