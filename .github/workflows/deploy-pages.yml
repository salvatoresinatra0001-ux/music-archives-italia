name: Distribuisci Music Archives Italia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'music-archives-italia-v13.1-GITHUB-PAGES-REPOSITORY-PRONTO.zip'
      - 'heartagram-italia/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Estrai e verifica i sei siti
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import sys
          archive = Path('music-archives-italia-v13.1-GITHUB-PAGES-REPOSITORY-PRONTO.zip')
          if not archive.is_file():
              print('Archivio assente: caricare il file ZIP v13.1 nella radice del repository.')
              sys.exit(1)
          expected = [
              'mylene-farmer-italia', 'assemblage23-italia',
              'mesh-italia', 'sandra-music-italia',
              'thebirthdaymassacre-italia', 'ville-valo-him-heartagram-italia'
          ]
          output = Path('_site')
          output.mkdir(exist_ok=True)
          with ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise ValueError('Archivio ZIP corrotto.')
              names = set(z.namelist())
              required = ['index.html'] + [f'{name}/index.html' for name in expected]
              missing = [p for p in required if p not in names]
              if missing:
                  raise ValueError(f'File essenziali mancanti: {missing}')
              count = 0
              for info in z.infolist():
                  path = Path(info.filename)
                  if info.is_dir() or path.is_absolute() or '..' in path.parts:
                      continue
                  if 'storico' in path.parts or path.suffix.lower() == '.zip':
                      continue
                  destination = output.joinpath(path)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(info))
                  count += 1
          print(f'Preparati {count} file. Sei sezioni presenti.')
          PY

      - name: Integra Heartagram Italia v1.1 senza sostituire l'archivio precedente
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source = Path('heartagram-italia')
          target = Path('_site/heartagram-italia')
          if not (source / 'index.html').is_file():
              raise FileNotFoundError('Pagina Heartagram Italia mancante')
          shutil.copytree(source, target, dirs_exist_ok=True,
                          ignore=shutil.ignore_patterns('.github', 'README.md'))

          previous = Path('_site/ville-valo-him-heartagram-italia/index.html')
          if previous.exists():
              doc = previous.read_text(encoding='utf-8')
              marker = '<!-- HEARTAGRAM_ITALIA_V11 -->'
              if marker not in doc:
                  banner = (
                      marker +
                      '<aside role="note" style="position:relative;z-index:1000;'
                      'background:#19131b;color:#fff;padding:14px 22px;'
                      'text-align:center;font:600 14px/1.5 sans-serif;'
                      'border-bottom:1px solid #c08caa">'
                      'Heartagram Italia: disponibile una nuova edizione indipendente. '
                      '<a style="color:#ffd3e8;text-decoration:underline" '
                      'href="../heartagram-italia/">Visita la versione 1.1 su GitHub Pages</a>'
                      '</aside>'
                  )
                  if re.search(r'<body\b[^>]*>', doc, flags=re.I):
                      doc = re.sub(r'<body\b[^>]*>',
                                   lambda m: m.group(0) + banner,
                                   doc, count=1, flags=re.I)
                  else:
                      doc = banner + doc
                  previous.write_text(doc, encoding='utf-8')
          print('Heartagram Italia v1.1 integrato; sei archivi originali preservati.')
          PY

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Carica artefatto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
